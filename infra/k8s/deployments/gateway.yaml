apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: doc-intel
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: doc-intel/gateway:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: uploads-pvc }
