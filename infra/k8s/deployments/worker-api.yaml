apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-api
  namespace: doc-intel
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-api }
  template:
    metadata:
      labels: { app: worker-api }
    spec:
      containers:
        - name: worker-api
          image: doc-intel/worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef:    { name: app-secrets }
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1, memory: 1Gi }
