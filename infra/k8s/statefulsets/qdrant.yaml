apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: doc-intel
spec:
  serviceName: qdrant-service
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant
          ports: [{ containerPort: 6333 }]
          readinessProbe:
            tcpSocket: { port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: qdrant-data, mountPath: /qdrant/storage }
  volumeClaimTemplates:
    - metadata: { name: qdrant-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
