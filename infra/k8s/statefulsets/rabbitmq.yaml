apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: doc-intel
spec:
  serviceName: rabbitmq-service
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - { containerPort: 5672 }
            - { containerPort: 15672 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - { name: rabbitmq-data, mountPath: /var/lib/rabbitmq }
  volumeClaimTemplates:
    - metadata: { name: rabbitmq-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
