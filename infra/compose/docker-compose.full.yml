services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql

  worker-api:
    image: doc-intel/worker:dev
    environment: &worker-env
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docs
      LLM_API_KEY: ${LLM_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    depends_on: [qdrant, rabbitmq, postgres]

  worker-consumer:
    image: doc-intel/worker:dev
    command: ["python", "-m", "worker.consumer"]     # <- command override
    environment: *worker-env
    volumes: [uploads:/data/uploads]
    depends_on: [rabbitmq, postgres, qdrant]

  gateway:
    image: doc-intel/gateway:dev
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/docs
      WORKER_URL: http://worker-api:8000
      UPLOAD_DIR: /data/uploads
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
    depends_on: [rabbitmq, postgres]

  web:
    image: doc-intel/web:dev
    environment:
      GATEWAY_URL: http://gateway:3000
    ports: ["3001:3000"]
    depends_on: [gateway]

volumes:
  rabbitmq_data:
  qdrant_data:
  postgres_data:
  uploads: